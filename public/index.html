<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化工具 - IT 统一门户</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05070b;--bg2:#0b1019;--card:rgba(255,255,255,.025);--border:rgba(255,255,255,.08);--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--accent:#22d3ee;--accent2:#06b6d4;--accent-bg:rgba(34,211,238,.1);--accent-border:rgba(34,211,238,.5);--input-bg:rgba(0,0,0,.2);--code-bg:rgba(0,0,0,.3);--code-text:#a5f3fc;--success:#34d399;--success-bg:rgba(52,211,153,.08);--success-border:rgba(52,211,153,.3);--error:#fb7185;--error-bg:rgba(251,113,133,.08);--error-border:rgba(251,113,133,.3);--btn-bg:#22d3ee;--btn-text:#0f172a}
body.light{--bg:#f4f7fb;--bg2:#fff;--card:rgba(255,255,255,.68);--border:rgba(15,36,58,.11);--text:#162033;--text2:#475569;--text3:#52647a;--accent:#08738d;--accent2:#0e7490;--accent-bg:rgba(14,165,183,.08);--accent-border:rgba(14,165,183,.3);--input-bg:#f6f9fc;--code-bg:#f6f9fc;--code-text:#162033;--success:#047857;--success-bg:#ecfdf5;--success-border:rgba(4,120,87,.3);--error:#9f1239;--error-bg:#fff1f2;--error-border:rgba(180,35,24,.3);--btn-bg:#0891b2;--btn-text:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.25rem;font-weight:500}
.header .subtitle{font-size:.8rem;color:var(--text3);margin-left:.75rem}
.theme-toggle{background:var(--card);border:1px solid var(--border);border-radius:.5rem;padding:.4rem .75rem;color:var(--text2);cursor:pointer;font-size:.8rem}
.container{max-width:64rem;margin:0 auto;padding:2rem 1.5rem}
.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.18em;color:var(--accent);margin-bottom:.25rem}
.section-heading{font-size:1.75rem;font-weight:300;margin-bottom:.5rem}
.section-desc{font-size:.85rem;color:var(--text3);margin-bottom:1.5rem}
.mode-picker{display:flex;gap:.5rem;margin-bottom:1.5rem}
.mode-btn{padding:.5rem 1rem;border-radius:.75rem;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:.85rem;transition:all .2s}
.mode-btn.active{border-color:var(--accent-border);background:var(--accent-bg);color:var(--accent)}
.card{border:1px solid var(--border);background:var(--card);border-radius:1rem;padding:1.5rem;margin-bottom:1.5rem}
.card h3{font-size:1rem;font-weight:500;margin-bottom:.75rem}
textarea{width:100%;min-height:12rem;border:1px solid var(--border);background:var(--input-bg);color:var(--text);border-radius:.75rem;padding:.75rem 1rem;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.85rem;resize:vertical;outline:none;transition:border-color .2s}
textarea:focus{border-color:var(--accent-border)}
.error-box{border:1px solid var(--error-border);background:var(--error-bg);color:var(--error);border-radius:.75rem;padding:.75rem 1rem;font-size:.85rem;margin-top:.75rem}
.btn-row{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1rem}
.btn{padding:.6rem 1.25rem;border-radius:.75rem;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:opacity .2s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--btn-bg);color:var(--btn-text)}
.btn-outline{background:transparent;border:1px solid var(--accent-border);color:var(--accent)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.output-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:.5rem;margin-bottom:.75rem}
.output-header span:first-child{font-size:.7rem;text-transform:uppercase;letter-spacing:.18em;color:var(--text3)}
.output-header span:last-child{font-size:.75rem;color:var(--text3)}
pre.output{max-height:20rem;overflow:auto;border:1px solid var(--border);background:var(--code-bg);border-radius:.5rem;padding:1rem;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:.8rem;line-height:1.5;color:var(--code-text);white-space:pre-wrap;word-break:break-all}
.file-input-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;margin-top:1rem}
.file-input-wrap input[type=file]{font-size:.85rem;color:var(--text2)}
.file-list{margin-top:1rem;display:flex;flex-direction:column;gap:.5rem}
.file-item{display:flex;align-items:center;justify-content:space-between;gap:.75rem;border:1px solid var(--border);background:var(--card);border-radius:.75rem;padding:.75rem 1rem}
.file-name{font-family:monospace;font-size:.85rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.file-status{font-size:.75rem;flex-shrink:0}
.file-status.done{color:var(--success)}
.file-status.error{color:var(--error)}
.file-status.pending{color:var(--text3)}
.footer{text-align:center;padding:2rem;font-size:.75rem;color:var(--text3);border-top:1px solid var(--border);margin-top:2rem}
@media(max-width:640px){.container{padding:1rem}.header{padding:.75rem 1rem}.header h1{font-size:1rem}.section-heading{font-size:1.35rem}}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;align-items:baseline">
    <h1>JSON 格式化工具</h1>
    <span class="subtitle">IT 统一门户</span>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
</div>
<div class="container">
  <div class="section-title">JSON TOOL</div>
  <div class="section-heading">JSON 格式化 / 压缩</div>
  <div class="section-desc">将 JSON 格式化为连续文本（压缩），或美化输出。支持上传多个 JSON 文件批量处理并下载 TXT。</div>
  <div style="font-size:.78rem;color:var(--text3);margin-bottom:1.5rem;padding:.6rem 1rem;background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:.5rem">所有数据处理均在浏览器本地完成，不会上传或存储到服务器。刷新页面后数据自动清除。</div>

  <div class="mode-picker">
    <button class="mode-btn active" id="modeMinify" onclick="setMode('minify')">压缩为连续文本</button>
    <button class="mode-btn" id="modeBeautify" onclick="setMode('beautify')">美化输出</button>
  </div>

  <div class="card">
    <h3>粘贴 JSON</h3>
    <textarea id="jsonInput" placeholder='在此粘贴 JSON 内容，例如 {"key": "value"}'></textarea>
    <div id="errorBox" class="error-box" style="display:none"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="processBtn" onclick="processText()">压缩</button>
      <button class="btn btn-outline" id="copyBtn" onclick="copyOutput()" disabled>复制结果</button>
      <button class="btn btn-ghost" onclick="clearAll()">清空</button>
    </div>
    <div id="outputSection" style="display:none;margin-top:1rem">
      <div class="output-header">
        <span>输出结果</span>
        <span id="outputLength">0 字符</span>
      </div>
      <pre class="output" id="outputPre"></pre>
    </div>
  </div>

  <div class="card">
    <h3>批量上传 JSON 文件</h3>
    <p style="font-size:.8rem;color:var(--text3)">选择多个 .json 文件，分别处理后生成 TXT 文件下载。</p>
    <div class="file-input-wrap">
      <input type="file" id="fileInput" accept=".json" multiple onchange="handleFiles(event)" />
      <button class="btn btn-primary" id="processFilesBtn" onclick="processFiles()" disabled>处理全部文件</button>
      <button class="btn btn-outline" id="downloadAllBtn" onclick="downloadAll()" disabled>下载全部 TXT</button>
    </div>
    <div class="file-list" id="fileList"></div>
  </div>
</div>
<div class="footer">IT 统一门户 · JSON 格式化工具</div>

<script>
let mode = 'minify';
let files = [];

function setMode(m) {
  mode = m;
  document.getElementById('modeMinify').classList.toggle('active', m === 'minify');
  document.getElementById('modeBeautify').classList.toggle('active', m === 'beautify');
  document.getElementById('processBtn').textContent = m === 'minify' ? '压缩' : '美化';
}

function processText() {
  const input = document.getElementById('jsonInput').value.trim();
  const errBox = document.getElementById('errorBox');
  const outSection = document.getElementById('outputSection');
  const outPre = document.getElementById('outputPre');
  const outLen = document.getElementById('outputLength');
  const copyBtn = document.getElementById('copyBtn');
  errBox.style.display = 'none';
  outSection.style.display = 'none';
  copyBtn.disabled = true;
  if (!input) { errBox.textContent = '请输入 JSON 内容'; errBox.style.display = 'block'; return; }
  try {
    const parsed = JSON.parse(input);
    const result = mode === 'minify' ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 2);
    outPre.textContent = result;
    outLen.textContent = result.length + ' 字符';
    outSection.style.display = 'block';
    copyBtn.disabled = false;
  } catch (e) {
    errBox.textContent = 'JSON 格式错误：' + e.message;
    errBox.style.display = 'block';
  }
}

function copyOutput() {
  const text = document.getElementById('outputPre').textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => flash('已复制到剪贴板')).catch(() => flash('复制失败'));
}

function clearAll() {
  document.getElementById('jsonInput').value = '';
  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('outputSection').style.display = 'none';
  document.getElementById('copyBtn').disabled = true;
}

function handleFiles(e) {
  const inputFiles = Array.from(e.target.files || []);
  files = inputFiles.map(f => ({ file: f, name: f.name, status: 'pending', result: '', error: '' }));
  renderFileList();
  document.getElementById('processFilesBtn').disabled = !files.length;
  document.getElementById('downloadAllBtn').disabled = true;
}

async function processFiles() {
  if (!files.length) return;
  document.getElementById('processFilesBtn').disabled = true;
  document.getElementById('processFilesBtn').textContent = '处理中…';
  for (const item of files) {
    try {
      const text = await item.file.text();
      const parsed = JSON.parse(text);
      item.result = mode === 'minify' ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 2);
      item.status = 'done';
      item.error = '';
    } catch (e) {
      item.status = 'error';
      item.error = 'JSON 格式错误：' + e.message;
      item.result = '';
    }
  }
  document.getElementById('processFilesBtn').textContent = mode === 'minify' ? '处理全部文件' : '处理全部文件';
  document.getElementById('processFilesBtn').disabled = false;
  document.getElementById('downloadAllBtn').disabled = !files.some(i => i.status === 'done');
  renderFileList();
}

function renderFileList() {
  const container = document.getElementById('fileList');
  container.innerHTML = files.map((item, idx) => {
    let statusHtml = '';
    if (item.status === 'done') statusHtml = '<span class="file-status done">处理成功 · ' + item.result.length + ' 字符</span>';
    else if (item.status === 'error') statusHtml = '<span class="file-status error">' + item.error + '</span>';
    else statusHtml = '<span class="file-status pending">待处理</span>';
    const dlBtn = item.status === 'done' ? '<button class="btn btn-outline" style="padding:.35rem .75rem;font-size:.75rem" onclick="downloadTxt(' + idx + ')">下载 TXT</button>' : '';
    return '<div class="file-item"><span class="file-name">' + item.name + '</span>' + statusHtml + dlBtn + '</div>';
  }).join('');
}

function downloadTxt(idx) {
  const item = files[idx];
  if (!item || item.status !== 'done') return;
  const txtName = item.name.replace(/\.json$/i, '') + '.txt';
  const blob = new Blob([item.result], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = txtName; a.click();
  URL.revokeObjectURL(url);
}

function downloadAll() {
  const doneItems = files.map((f, i) => ({ ...f, idx: i })).filter(i => i.status === 'done');
  if (!doneItems.length) return;
  doneItems.forEach((item, i) => setTimeout(() => downloadTxt(item.idx), i * 200));
}

function toggleTheme() {
  const body = document.body;
  const isLight = body.classList.toggle('light');
  localStorage.setItem('json-tool-theme', isLight ? 'light' : 'dark');
}

function flash(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;top:1rem;right:1rem;background:var(--accent);color:var(--btn-text);padding:.5rem 1rem;border-radius:.5rem;font-size:.85rem;z-index:9999;animation:fadeOut 2s forwards';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

(function init() {
  const saved = localStorage.getItem('json-tool-theme');
  if (saved === 'light') document.body.classList.add('light');
})();
</script>
<style>@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}</style>
</body>
</html>
